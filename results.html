<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>실험 기록 모아보기</title>
<style>
:root{--navy:#243484;--ink:#1A1F36;--muted:#646D8C;--line:#E4E8F4;--paper:#F5F7FC;--ok:#1E7A4E;--warn:#B4331F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding-bottom:80px}
.hd{background:var(--navy);color:#fff;padding:24px 20px}
.hd h1{margin:0;font-size:21px}.hd p{margin:4px 0 0;font-size:13px;opacity:.8}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;min-width:220px}
.btn{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:10px;padding:11px 16px;background:var(--navy);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.stats{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--paper);font-size:12px;color:var(--muted)}
.ok{color:var(--ok);font-weight:800}.no{color:var(--warn);font-weight:800}
.msg{font-size:13px;margin-top:10px}.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.rst{font:inherit;font-size:12px;font-weight:800;border-radius:8px;padding:6px 10px;cursor:pointer;background:#fff;color:var(--warn);border:1px solid #F1C8C0}
.rst:hover{background:#FBE9E5}
details.edit{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.edit summary{cursor:pointer;font-weight:800;font-size:14px;color:var(--navy)}
.ein{min-width:0;width:110px;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px}.ein.sm{width:56px}
.sec{font-size:15px;font-weight:800;margin:22px 0 8px}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="hd"><h1>실험 기록 모아보기</h1><p>링크별로 기록이 다 채워졌는지 확인하고, 파일로 내려받습니다</p></div>
<div class="wrap">
  <div class="row"><input id="key" type="password" placeholder="결과 열람 키 (RESULTS_KEY)" autocomplete="off"><button class="btn" id="load">불러오기</button></div>
  <div class="msg" id="msg"></div>
  <div id="out"></div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i);}, items=[];
  var ORDER={G1:["s1","s3","s9","s10"],G2:["s9","s10","s1","s3"],G3:["s7","s8","s5","s6"],G4:["s5","s6","s7","s8"]};
  try{ $("key").value=sessionStorage.getItem("sf_key")||""; }catch(e){}
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  function field(t,k){ var m=t.match(new RegExp("^"+k+"[^\\t\\n]*\\t([^\\n]*)","m")); return m?m[1].trim():""; }
  function latest(list,keyf){ var m={}; list.forEach(function(x){ var k=keyf(x); if(!m[k]||m[k].savedAt<x.savedAt) m[k]=x; }); return Object.keys(m).map(function(k){return m[k];}); }
  var surveys=[], ALL=[], pres=[], posts=[];
  function del(q,label){
    var k=$("key").value.trim();
    if(!confirm(label+"\n\n삭제한 기록은 되돌릴 수 없습니다. 계속할까요?")) return;
    $("msg").className="msg"; $("msg").textContent="삭제하는 중…";
    fetch("/api/log?key="+encodeURIComponent(k)+"&"+q,{method:"DELETE"}).then(function(r){ return r.json().then(function(j){return {ok:r.ok,j:j};}); })
    .then(function(res){ if(!res.ok) throw res.j.error; load(); setTimeout(function(){ $("msg").className="msg ok"; $("msg").textContent=res.j.deleted+"개 기록을 삭제했습니다."; },600); })
    .catch(function(e){ $("msg").className="msg err"; $("msg").textContent="삭제하지 못했습니다 ("+e+")."; });
  }
  function mean(a){ a=a.filter(function(v){return typeof v==="number"&&!isNaN(v);}); return a.length?a.reduce(function(s,v){return s+v;},0)/a.length:null; }
  function sv(pid,skind,n){ return surveys.filter(function(x){return x.pid===pid&&x.skind===skind&&+x.n===+n;})[0]; }
  function tlxOf(a){ return a?mean(["tlx_md","tlx_pd","tlx_td","tlx_pf","tlx_ef","tlx_fr"].map(function(k){return a[k];})):null; }
  function tiaOf(a){ if(!a) return null; var v=[]; for(var i=1;i<=12;i++){ var x=a["tia"+i]; if(typeof x==="number") v.push(i<=5?8-x:x); } return mean(v); }
  function r2(v){ return v==null?"":Math.round(v*100)/100; }
  function merged(x){ var s=x.survey||{}; return {tlx:s.tlx==null?"":s.tlx,tia:s.tia==null?"":s.tia,done:!!x.survey}; }
  function dl(name,text,type){ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:type})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  $("load").addEventListener("click",load);
  $("key").addEventListener("keydown",function(e){ if(e.key==="Enter") load(); });
  function load(){
    var k=$("key").value.trim(); if(!k){ $("msg").textContent="키를 입력하세요."; return; }
    $("msg").className="msg"; $("msg").textContent="불러오는 중…";
    fetch("/api/log?key="+encodeURIComponent(k)).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
    .then(function(res){
      if(!res.ok){ $("msg").className="msg err"; $("msg").textContent=res.j.error==="unauthorized"?"키가 맞지 않습니다.":"불러오지 못했습니다 ("+res.j.error+")."; return; }
      try{ sessionStorage.setItem("sf_key",k); }catch(e){}
      var all=res.j.items||[]; ALL=all;
      items=latest(all.filter(function(x){return x.type!=="survey"&&x.type!=="pre"&&x.type!=="post";}),function(x){return x.pid+"|"+x.order+"|"+x.link;});
      posts=latest(all.filter(function(x){return x.type==="post";}),function(x){return x.pid;});
      pres=latest(all.filter(function(x){return x.type==="pre";}),function(x){return x.pid;});
      surveys=latest(all.filter(function(x){return x.type==="survey";}),function(x){return x.pid+"|"+x.skind+"|"+x.n;});
      $("msg").textContent=""; render(all.length);
    }).catch(function(){ $("msg").className="msg err"; $("msg").textContent="네트워크 오류로 불러오지 못했습니다."; });
  }
  var tsvHead=["참가자","순서","링크","조건","시나리오","종목 세트","Agreement","Switch","알아낸 것 정답 수","총 소요(초)","TLX(평균)","TIA(평균)","저장 시각"].join("\t");
  /* ───────── 엑셀 만들기: 숫자 코드를 사람이 읽을 수 있는 내용으로 풀어서 기록 ───────── */
  var HEAD=["참가자","순서","링크","조건","시나리오","종목 세트","추천 1위","첫 선택","최종 선택","Agreement(최종=1위)","Switch(첫 선택≠1위→최종=1위)",
    "알아낸 것 정답 수","목표1 문항","목표1 답","목표1 채점","목표2 문항","목표2 답","목표2 채점","목표3 문항","목표3 답","목표3 채점",
    "조건 입력 시도 횟수","총 소요(초)","질문·설명 요청 수","에이전트 제안","제안 수락","제안 거절","제안 무응답","선택 이유","TLX(평균)","TIA(평균)","저장 시각"];
  function goals(t){ var g=[]; t.split("\n").forEach(function(l){ if(/^목표\d/.test(l)){ var c=l.split("\t"); g.push({q:c[0].replace(/^목표\d\s*/,"").replace(/^\(|\)$/g,""),a:c[1]||"",ok:(c[2]||"")}); } }); return g; }
  function num(v){ return (v!==""&&v!=null&&/^-?\d+(\.\d+)?$/.test(String(v)))?+v:v; }
  function rowObj(x){ var t=x.text||"", s=x.survey||{}, g=goals(t), o={};
    var v=[x.pid,x.order,x.link,field(t,"조건"),field(t,"시나리오"),field(t,"종목 세트"),field(t,"추천 1위"),field(t,"첫 선택"),field(t,"최종 선택"),field(t,"Agreement"),field(t,"Switch"),field(t,"알아낸 것 정답 수")];
    for(var i=0;i<3;i++){ var gi=g[i]||{}; v.push(gi.q||"",gi.a||"",gi.ok||""); }
    v.push(field(t,"조건 입력 시도"),field(t,"총 소요"),field(t,"질문·설명 요청 수"),field(t,"에이전트 제안"),field(t,"제안 수락"),field(t,"제안 거절"),field(t,"제안 무응답"),field(t,"선택 이유"),
      s.tlx==null?"":s.tlx,s.tia==null?"":s.tia,(x.savedAt||"").replace("T"," ").slice(0,19));
    HEAD.forEach(function(h,i){ o[h]=num(v[i]); }); return o; }
  var CODE={r1:"투자 성향: 안정형",r2:"투자 성향: 안정추구형",r3:"투자 성향: 위험중립형",r4:"투자 성향: 적극투자형",r5:"투자 성향: 공격투자형",
    p1:"투자 기간: 6개월 이내",p2:"투자 기간: 6개월~1년",p3:"투자 기간: 1~3년",p4:"투자 기간: 3년 이상",
    a1:"투자 금액: 300만원",a2:"투자 금액: 1,000만원",a3:"투자 금액: 3,000만원",
    s1:"관심 업종: 반도체",s2:"관심 업종: 2차전지",s3:"관심 업종: 바이오",s4:"관심 업종: 금융",s5:"관심 업종: IT",
    t1:"목표 수익률: 5%",t2:"목표 수익률: 20%",t3:"목표 수익률: 30% 이상"};
  var EXP={reason:"추천 이유",risk:"위험 요인",compare:"다른 종목과 비교",fundamental:"재무 지표",dividend:"배당 정보",transparency:"내 정보 사용 방식",gen:"자유 질문(AI 생성 답변)","생성":"자유 질문(AI 생성 답변)"};
  function sgText(c){ var p=String(c).split(":");
    if(p[0]==="cur") return "이 종목의 "+(EXP[p[1]]||p[1])+" 보기";
    if(p[0]==="stock") return p.slice(1).join(":")+" 종목 보기";
    if(p[0]==="x") return p[1]+"의 "+(EXP[p[2]]||p[2]||"")+" 보기";
    if(p[0]==="again") return (EXP[p[1]]||p[1])+" 다시 보기";
    return c; }
  function explain(kind,c){ c=String(c==null?"":c);
    if(kind==="조건"&&CODE[c]) return CODE[c];
    if(kind==="종목 열람") return "종목 코드 "+c+" 화면 열기";
    if(kind==="에이전트 제안") return "에이전트가 제안함: "+sgText(c);
    if(kind==="제안 수락") return "제안 수락 (네, 보여주세요): "+sgText(c);
    if(kind==="제안 거절") return "제안 거절 (괜찮아요): "+sgText(c);
    if(kind==="제안 무응답") return "제안에 답하지 않고 넘어감: "+sgText(c);
    if(kind==="제안 수락 응답"){ var a=c.split(" | "); return "수락한 설명 표시: "+(EXP[a[0]]||a[0]); }
    if(kind==="질문"){ var q=c.split(" | "); return "참가자 질문 ["+(EXP[q[0]]||q[0])+"] "+q.slice(1).join(" | "); }
    if(kind==="답변"){ var r=c.split(" | "); return "AI 답변: "+r.slice(1).join(" | "); }
    return c; }
  function logRows(list){ var out=[]; list.forEach(function(x){ var t=x.text||"", i=t.indexOf("[상호작용 로그]"); if(i<0) return;
      t.slice(i).split("\n").slice(1).forEach(function(line){ var c=line.split("\t"); if(c.length<2||!/^\d+$/.test(c[0])) return;
        var cont=c.slice(2).join(" ");
        out.push({"참가자":x.pid,"링크":x.link,"순서":x.order,"초":+c[0],"종류":c[1],"내용":cont,"풀어 쓴 내용":explain(c[1],cont)}); }); });
    return out; }
  function sgRows(list){ var out=[]; list.forEach(function(x){ var t=x.text||"", i=t.indexOf("[상호작용 로그]"); if(i<0) return;
      var ev=t.slice(i).split("\n").slice(1).map(function(l){ return l.split("\t"); }).filter(function(c){ return c.length>=2&&/^\d+$/.test(c[0]); });
      ev.forEach(function(c,k){ if(c[1]!=="에이전트 제안") return; var code=c.slice(2).join(" "), res="응답 전 종료", rt="";
        for(var j=k+1;j<ev.length;j++){ var kd=ev[j][1]; if(kd==="제안 수락"||kd==="제안 거절"||kd==="제안 무응답"){ res=kd==="제안 수락"?"수락":(kd==="제안 거절"?"거절":"무응답(직접 질문 등으로 넘어감)"); rt=(+ev[j][0])-(+c[0]); break; } }
        out.push({"참가자":x.pid,"링크":x.link,"순서":x.order,"제안 시각(초)":+c[0],"제안 내용":sgText(code),"참가자 반응":res,"반응까지(초)":rt}); }); });
    return out; }
  var TLXQ=[["tlx_md","정신적 요구 — 생각하고 판단하는 데 머리를 얼마나 써야 했나요?"],["tlx_pd","신체적 요구 — 몸을 얼마나 써야 했나요?"],["tlx_td","시간적 요구 — 시간에 얼마나 쫓긴다고 느꼈나요?"],
    ["tlx_pf","수행도 — 과제를 얼마나 잘 해냈다고 느끼나요? (0=완벽함, 100=실패함)"],["tlx_ef","노력 — 이 정도로 해내기 위해 얼마나 애써야 했나요?"],["tlx_fr","좌절 — 얼마나 불안하거나 짜증 나거나 스트레스를 받았나요?"]];
  var TIAQ=["이 시스템은 사람을 속인다","이 시스템은 부정직하게 행동한다","나는 이 시스템의 의도, 행동 또는 결과가 의심스럽다","나는 이 시스템을 경계하게 된다","이 시스템의 행동은 해롭거나 손해를 끼치는 결과를 낼 것이다",
    "나는 이 시스템을 확신한다","이 시스템은 안전함을 제공한다","이 시스템은 진실성(무결성)을 갖추고 있다","이 시스템은 의지할 만하다","이 시스템은 신뢰도가 높다","나는 이 시스템을 신뢰할 수 있다","나는 이 시스템에 익숙하다"];
  var LIK=["","1 전혀 그렇지 않다","2","3","4 보통","5","6","7 매우 그렇다"];
  function surveyRows(list){ var out=[]; list.forEach(function(x){ var a=(x.survey&&x.survey.answers)||{}; if(!x.survey) return;
      TLXQ.forEach(function(q,i){ out.push({"참가자":x.pid,"링크":x.link,"순서":x.order,"척도":"NASA-TLX","번호":i+1,"문항":q[1],"응답":a[q[0]],"응답 의미":a[q[0]]==null?"":a[q[0]]+" / 100","역채점":"","채점값":a[q[0]]}); });
      TIAQ.forEach(function(q,i){ var v=a["tia"+(i+1)], rv=i<5; out.push({"참가자":x.pid,"링크":x.link,"순서":x.order,"척도":"TIA","번호":i+1,"문항":q,"응답":v,"응답 의미":v==null?"":LIK[v],"역채점":rv?"예 (8−응답)":"","채점값":v==null?"":(rv?8-v:v)}); });
      out.push({"참가자":x.pid,"링크":x.link,"순서":x.order,"척도":"평균","번호":"","문항":"TLX 평균 (0~100, 높을수록 부담 큼) / TIA 평균 (1~7, 높을수록 신뢰 높음)","응답":"","응답 의미":"TLX "+x.survey.tlx+" · TIA "+x.survey.tia,"역채점":"","채점값":""}); });
    return out; }
  var PREC=[["age","나이"],["gender","성별"],["job","전공·직업"],["invest","주식 투자 경험"],["finapp","금융·증권 앱 사용 빈도"],["aichat","AI 챗봇 사용 빈도"],
    ["finlit","금융 지식 자기평가 (1~7)"],["pt1","신뢰성향1 이유 없는 한 기계를 믿는다"],["pt2","신뢰성향2 기계를 믿지 않는다 (역)"],["pt3","신뢰성향3 기계의 도움에 의지한다"],
    ["pt4","신뢰성향4 기계 신뢰 경향이 높다"],["pt5","신뢰성향5 기계가 제 역할을 할 것이라 믿는다"],["pt6","신뢰성향6 잘 모르는 기계라도 믿는다"],["trustProp","자동화 신뢰 성향 평균 (1~7)"]];
  function preRows(list){ return list.map(function(x){ var a=x.answers||{}, o={"참가자":x.pid}; PREC.forEach(function(c){ o[c[1]]=a[c[0]]==null?"":a[c[0]]; }); o["저장 시각"]=(x.savedAt||"").replace("T"," ").slice(0,19); return o; }); }
  var POSTC=[["felt_user","방식A(묻는 것에만 답함) 누가 정했나 (1 내가~7 AI가)"],["felt_mixed","방식B(다음 설명 제안) 누가 정했나 (1 내가~7 AI가)"],
    ["diff","두 방식 차이 지각"],["prefer","더 편했던 방식"],["prefer_why","고른 이유"],["trust_more","더 믿을 수 있었던 방식"],
    ["sug_help","제안이 도움 됨 (1~7)"],["sug_hinder","제안이 방해·귀찮음 (1~7)"],["moment","신뢰·의심 순간"],["heard","실험 내용 사전 노출"]];
  function postRows(list){ return list.map(function(x){ var a=x.answers||{}, o={"참가자":x.pid}; POSTC.forEach(function(c){ o[c[1]]=a[c[0]]==null?"":a[c[0]]; }); o["저장 시각"]=(x.savedAt||"").replace("T"," ").slice(0,19); return o; }); }
  function xlsx(name,list,preList,postList){
    if(!window.XLSX){ alert("엑셀 변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요."); return; }
    var wb=XLSX.utils.book_new();
    if(list.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(list.map(rowObj),{header:HEAD}),"과제 기록");
    var sg=sgRows(list); if(sg.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sg),"제안 기록");
    var sv=surveyRows(list); if(sv.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sv),"설문 응답");
    var lg=logRows(list); if(lg.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lg),"상호작용 로그");
    if(preList&&preList.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(preRows(preList)),"사전 설문");
    if(postList&&postList.length) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(postRows(postList)),"사후 설문");
    if(!wb.SheetNames.length){ alert("받을 기록이 없습니다."); return; }
    XLSX.writeFile(wb,name); }
  function tsvRow(x){ var t=x.text||"", mm=merged(x); return [x.pid,x.order,x.link,field(t,"조건"),field(t,"시나리오"),field(t,"종목 세트"),field(t,"Agreement"),field(t,"Switch"),field(t,"알아낸 것 정답 수"),field(t,"총 소요"),mm.tlx,mm.tia,x.savedAt].join("\t"); }

    h+='<p class="muted">분석기 1단계의 <b>[파일로 한꺼번에 가져오기]</b>에 .json 파일(또는 전체 엑셀)을 넣으면 과제 기록과 사전·사후 설문이 한 번에 들어갑니다. 같은 과제를 다시 한 경우 가장 최근 기록만 씁니다.</p>';
    h+='<div class="sec">사전 · 사후 설문 (각 20명 예정)</div><div class="tw"><table><thead><tr><th>항목</th><th>기록 수</th><th>파일 받기</th></tr></thead><tbody>'+
       '<tr><td><b>사전 설문</b> (/pre)</td><td class="'+(pres.length>=20?'ok':'')+'">'+(pres.length>=20?'✓ ':'')+pres.length+' / 20</td>'+
       '<td><button class="btn ghost" id="dlPre" style="padding:6px 10px;font-size:12px">엑셀</button> <button class="rst" id="rstPre">초기화</button></td></tr>'+

               ["s7","안정 운용 · 사용자 주도 · 세트 B"],["s8","장기 성장 · 사용자 주도 · 세트 B"],["s9","안정 운용 · 혼합 주도 · 세트 B"],["s10","장기 성장 · 혼합 주도 · 세트 B"]];
    h+='<div class="sec">링크별 기록 (각 10개 예정)</div><div class="tw"><table><thead><tr><th>링크</th><th>시나리오 · 조건 · 세트</th><th>기록 수</th><th>파일 받기</th></tr></thead><tbody>';
    LINKS.forEach(function(L){ var xs=items.filter(function(x){return x.link===L[0];});
      h+='<tr><td><b>'+L[0]+'</b></td><td>'+L[1]+'</td><td class="'+(xs.length>=10?'ok':'')+'">'+(xs.length>=10?'✓ ':'')+xs.length+' / 10</td>'+
         '<td><button class="btn ghost" data-ln="'+L[0]+'" data-fmt="tsv" style="padding:6px 10px;font-size:12px">엑셀</button> <button class="btn ghost" data-ln="'+L[0]+'" data-fmt="json" style="padding:6px 10px;font-size:12px">.json</button> <button class="rst" data-rl="'+L[0]+'">초기화</button></td></tr>'; });
    h+='</tbody></table></div>';
    /* 기록 수정: 잘못 입력된 참가자 번호·순서를 고침 (평소에는 접혀 있음) */
    var ED=items.concat(pres,posts).slice().sort(function(a,b){ var la=a.type==="pre"?"0":(a.type==="post"?"z":a.link), lb=b.type==="pre"?"0":(b.type==="post"?"z":b.link);

    h+='</tbody></table></div></details>';

        .then(function(res){ if(!res.ok) throw res.j.error; load(); setTimeout(function(){ $("msg").className="msg ok"; $("msg").textContent="수정했습니다: "+res.j.key; },600); })
        .catch(function(e){ $("msg").className="msg err"; $("msg").textContent="수정하지 못했습니다 ("+e+")."; }); }; });
    $("out").querySelectorAll("[data-dk]").forEach(function(b){ b.onclick=function(){ var x=ED[+b.dataset.dk]; del("target="+encodeURIComponent(x.key),(x.type==="pre"?"사전 설문":(x.type==="post"?"사후 설문":x.link))+" · "+x.pid+" 기록 1개를 삭제합니다."); }; });
    $("dlJson").onclick=function(){ dl("StockFit_기록_"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({items:items.concat(pres,posts)},null,1),"application/json"); };

    $("out").querySelectorAll("[data-rp]").forEach(function(b){ b.onclick=function(){ del("pid="+encodeURIComponent(b.dataset.rp), b.dataset.rp+" 참가자의 과제 기록과 설문을 모두 삭제합니다. 이 참가자는 처음부터 다시 진행할 수 있습니다."); }; });
    $("out").querySelectorAll("[data-rk]").forEach(function(b){ b.onclick=function(){ if(!b.dataset.rk) return; del("target="+encodeURIComponent(b.dataset.rk), "이 과제 기록 1개를 삭제합니다. (다시 하기 전 기록까지 모두 지우려면 링크·참가자 초기화를 쓰세요)"); }; });

      xlsx("StockFit_전체_"+new Date().toISOString().slice(0,10)+".xlsx",items,pres,posts); };

})();
